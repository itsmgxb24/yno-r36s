# Settings of the native YNO client (plain shell, read on every start).
# Remove the leading # to change a value.

# How much last-run.log says: debug, info or warning. Keep "debug" while testing.
#LOG_LEVEL=debug

# Keep the chat on screen all the time (1) instead of only for a few seconds after a message (0).
#CHAT_PINNED=0

# SDL video driver. Empty = automatic. "kmsdrm" is what the handheld normally uses.
#VIDEO_DRIVER=""

# Value of the "auth" cookie of your YNO account (a long token), empty = play as a guest.
#AUTH=""

# File with the secret that signs the packets of the game rooms (seeing other players on the map).
# The official servers refuse unsigned packets: without this file the client plays on its own
# (chat and the player counter still work).
#ROOM_KEY_FILE="/roms/ports/yno-native/room.key"

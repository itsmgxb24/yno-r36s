# Builds the R36S client and attaches the zip to a GitHub release when a tag v* is pushed.
# Started by hand (Actions -> Release -> Run workflow) it only builds and keeps the zip as an artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie-slim   # the same userland as dArkOS and the local podman container
    defaults:
      run:
        shell: bash   # the container's default is sh (dash), which lacks ${var//x/y}
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install the cross toolchain
        run: bash r36s/build/install-deps.sh

      - name: Build
        run: OUT="$PWD/out" bash r36s/build/build.sh

      - name: Package
        run: bash r36s/package.sh "${GITHUB_REF_NAME//\//-}" out/yno-r36s dist

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: yno-r36s
          path: dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
